<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">A small, practical homelab</title><desc id="desc">Six hardware roles: N100 services, primary TrueNAS storage, second TrueNAS recovery, Pi encrypted backups, Dell Proxmox experiments and GL.iNet network testing. No physical wiring or network hierarchy is implied.</desc><rect width="1200" height="1050" rx="24" fill="#17191e"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="48" y="65" fill="#f38470" font-size="17" letter-spacing="3">SAMIRTECH / THE HOMELAB</text><text x="48" y="122" fill="#f4f4f5" font-size="42" font-weight="700">Small hardware. Clear roles.</text><text x="48" y="163" fill="#b7becb" font-size="22">Services, storage and recovery — without the enterprise rack.</text><g transform="translate(48 203)"><rect width="542" height="237" rx="16" fill="#22262e" stroke="#383e49"/><rect x="0" y="22" width="4" height="40" rx="2" fill="#61d8c1"/><text x="24" y="39" fill="#61d8c1" font-size="14" font-weight="700" letter-spacing="2">SERVICES</text><g transform="translate(430 72)" fill="none" stroke="#61d8c1" stroke-width="2.5" stroke-linecap="round"><rect x="0" y="18" width="82" height="42" rx="9"/><path d="M12 48h25m9 0h9"/><circle cx="68" cy="48" r="3"/></g><text x="24" y="89" fill="#f4f4f5" font-size="29" font-weight="700">GEEKOM N100</text><text x="24" y="126" fill="#d9dce3" font-size="20">Always-on Docker host</text><text x="24" y="169" fill="#aeb8c8" font-size="19">Caddy · DNS · monitoring</text></g><g transform="translate(610 203)"><rect width="542" height="237" rx="16" fill="#22262e" stroke="#383e49"/><rect x="0" y="22" width="4" height="40" rx="2" fill="#a9b8ff"/><text x="24" y="39" fill="#a9b8ff" font-size="14" font-weight="700" letter-spacing="2">PRIMARY STORAGE</text><g transform="translate(430 72)" fill="none" stroke="#a9b8ff" stroke-width="2.5" stroke-linecap="round"><rect x="17" y="0" width="49" height="76" rx="5"/><path d="M27 16h29M27 25h29M27 47h29M27 55h29"/><circle cx="42" cy="66" r="3"/></g><text x="24" y="89" fill="#f4f4f5" font-size="29" font-weight="700">Main TrueNAS</text><text x="24" y="126" fill="#d9dce3" font-size="20">HP Enterprise desktop</text><text x="24" y="169" fill="#aeb8c8" font-size="19">Live files and photo library</text></g><g transform="translate(48 460)"><rect width="542" height="237" rx="16" fill="#22262e" stroke="#383e49"/><rect x="0" y="22" width="4" height="40" rx="2" fill="#f3b875"/><text x="24" y="39" fill="#f3b875" font-size="14" font-weight="700" letter-spacing="2">LOCAL RECOVERY</text><g transform="translate(430 72)" fill="none" stroke="#f3b875" stroke-width="2.5" stroke-linecap="round"><rect x="0" y="6" width="80" height="65" rx="7"/><path d="M11 19h57M11 28h57M11 37h57M11 46h57"/><circle cx="66" cy="60" r="3"/></g><text x="24" y="89" fill="#f4f4f5" font-size="29" font-weight="700">Second TrueNAS</text><text x="24" y="126" fill="#d9dce3" font-size="20">Fractal Node 804</text><text x="24" y="169" fill="#aeb8c8" font-size="19">Recovery destination</text><text x="24" y="198" fill="#aeb8c8" font-size="19">Usually off or suspended</text></g><g transform="translate(610 460)"><rect width="542" height="237" rx="16" fill="#22262e" stroke="#383e49"/><rect x="0" y="22" width="4" height="40" rx="2" fill="#f3b875"/><text x="24" y="39" fill="#f3b875" font-size="14" font-weight="700" letter-spacing="2">BACKUP COPY</text><g transform="translate(430 72)" fill="none" stroke="#f3b875" stroke-width="2.5" stroke-linecap="round"><rect x="0" y="10" width="82" height="55" rx="6"/><rect x="29" y="24" width="25" height="25" rx="2"/><path d="M8 18h12M8 26h12M8 34h12M8 42h12M64 20h17M64 36h17M64 52h17"/></g><text x="24" y="89" fill="#f4f4f5" font-size="29" font-weight="700">Raspberry Pi 4</text><text x="24" y="126" fill="#d9dce3" font-size="20">Encrypted Restic repository</text><text x="24" y="169" fill="#aeb8c8" font-size="19">Sample restores verified</text><text x="24" y="198" fill="#aeb8c8" font-size="19">Remote-location test pending</text></g><g transform="translate(48 717)"><rect width="542" height="237" rx="16" fill="#22262e" stroke="#383e49"/><rect x="0" y="22" width="4" height="40" rx="2" fill="#99a7bb"/><text x="24" y="39" fill="#99a7bb" font-size="14" font-weight="700" letter-spacing="2">EXPERIMENTS</text><g transform="translate(430 72)" fill="none" stroke="#99a7bb" stroke-width="2.5" stroke-linecap="round"><rect x="0" y="18" width="82" height="42" rx="9"/><path d="M12 48h25m9 0h9"/><circle cx="68" cy="48" r="3"/></g><text x="24" y="89" fill="#f4f4f5" font-size="29" font-weight="700">Dell Micro PC</text><text x="24" y="126" fill="#d9dce3" font-size="20">Proxmox virtual machines</text><text x="24" y="169" fill="#aeb8c8" font-size="19">Powered off until needed</text></g><g transform="translate(610 717)"><rect width="542" height="237" rx="16" fill="#22262e" stroke="#383e49"/><rect x="0" y="22" width="4" height="40" rx="2" fill="#61d8c1"/><text x="24" y="39" fill="#61d8c1" font-size="14" font-weight="700" letter-spacing="2">NETWORK LAB</text><g transform="translate(430 72)" fill="none" stroke="#61d8c1" stroke-width="2.5" stroke-linecap="round"><rect x="1" y="30" width="80" height="34" rx="6"/><path d="M10 30V3M72 30V3M15 49h5m8 0h5m8 0h5"/></g><text x="24" y="89" fill="#f4f4f5" font-size="29" font-weight="700">GL.iNet router</text><text x="24" y="126" fill="#d9dce3" font-size="20">Isolated or mobile lab work</text><text x="24" y="169" fill="#aeb8c8" font-size="19">Separate testing role</text></g><text x="48" y="1016" fill="#aeb8c8" font-size="19">Hardware and roles • not a physical wiring diagram • illustrations are schematic</text></g></svg>