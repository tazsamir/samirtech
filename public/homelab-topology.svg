<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Samirtech homelab topology</title><desc id="desc">Internet connects to a GL.iNet router and home network. The network connects to the N100 Docker host, TrueNAS storage, HP Enterprise PC, Dell Micro PC and two-bay storage. TrueNAS and the two-bay storage are backed up to a second NAS and encrypted off-site storage.</desc><rect width="1200" height="620" fill="#111"/><g fill="none" stroke="#ff5f56" stroke-width="4"><path d="M600 90v70M600 230v70M600 370v70M300 370l300-70M900 370L600 300M300 440v70M600 440v70M900 440v70"/><path d="M600 300H300M600 300h300"/></g><g fill="#1b1b1b" stroke="#eee" stroke-width="3"><rect x="490" y="35" width="220" height="55" rx="8"/><rect x="490" y="175" width="220" height="55" rx="8"/><rect x="490" y="315" width="220" height="55" rx="8"/><rect x="190" y="375" width="220" height="65" rx="8"/><rect x="490" y="375" width="220" height="65" rx="8"/><rect x="790" y="375" width="220" height="65" rx="8"/><rect x="190" y="510" width="220" height="65" rx="8"/><rect x="490" y="510" width="220" height="65" rx="8"/><rect x="790" y="510" width="220" height="65" rx="8"/></g><g fill="#fff" font-family="monospace" font-size="22" text-anchor="middle"><text x="600" y="70">Internet</text><text x="600" y="210">GL.iNet router</text><text x="600" y="350">Home network</text><text x="300" y="415">GEEKOM N100</text><text x="600" y="415">Fractal Node 804</text><text x="900" y="415">HP Enterprise PC</text><text x="300" y="550">Dell Micro PC</text><text x="600" y="550">Two-bay storage</text><text x="900" y="550">Off-site / cloud</text></g></svg>