# Cloudflare Pages builds/deploys through its existing Git integration.
# This workflow validates the Hugo source; no Cloudflare secrets are needed.
name: Validate Hugo Site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Hugo Extended 0.142.0
        env:
          HUGO_VERSION: '0.142.0'
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          cd "$RUNNER_TEMP/hugo-bin"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/hugo_${HUGO_VERSION}_checksums.txt" -o checksums.txt
          grep " $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build published site
        run: hugo --minify --destination "$RUNNER_TEMP/site"
      - name: Validate scheduled posts
        run: hugo --buildFuture --destination "$RUNNER_TEMP/site-future"
