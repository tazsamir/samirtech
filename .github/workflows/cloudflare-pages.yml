# GitHub Actions workflow for deploying to Cloudflare Pages and fallback deployment
name: Deploy Hugo Site

on:
  push:
    branches: ["main"]

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go (required for Hugo Extended)
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      
      - name: Install and setup hugo extended
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.162.1/hugo_extended_0.162.1_Linux-64bit.tar.gz
          tar -xzf hugo_extended_0.162.1_Linux-64bit.tar.gz
          sudo -S -p '' mv hugo /usr/local/bin/
          rm hugo_extended_0.162.1_Linux-64bit.tar.gz
      
      - name: Build site with Hugo Extended
        run: |
          echo "Deploying to Cloudflare Pages"
          pwd

      - name: Configure Cloudflare Pages deployment (if using Git source)
        env:
          # Cloudflare requires these if you're not connected via Pages dashboard
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: samirtech
          BUILD_COMMAND: hugo --source $(pwd)
          PAGES_DIR: ./public
        run: |
          echo "Cloudflare integration configured"

      - name: Deploy to Cloudflare Pages via Wrangler
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: "pages deploy ./public --project-name=${{ github.event.repository.name }}"

      - name: Build local site (fallback for GitHub Pages or manual deploy)
        run: hugo

      - name: Upload artifact for other platforms
        uses: actions/upload-artifact@v4
        with:
          name: hugo-build
          path: public/
